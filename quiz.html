<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Career Quiz</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">

<!-- LANGUAGE -->
<div style="margin-bottom:20px;">

<button onclick="setLang('en')">
🇬🇧 English
</button>

<button onclick="setLang('sq')">
🇦🇱 Shqip
</button>

</div>

<h1 id="title">Career Quiz</h1>

<div id="progressText">0%</div>

<div style="width:100%;height:10px;background:#222;border-radius:10px;">

<div id="progressFill"
style="
width:0%;
height:10px;
background:#00C2FF;
border-radius:10px;
">
</div>

</div>

<h2 id="question"></h2>

<div class="answers">

<button onclick="answer(0)"></button>

<button onclick="answer(1)"></button>

<button onclick="answer(2)"></button>

<button onclick="answer(3)"></button>

</div>

</section>

<script>

// ====================
// LANGUAGE
// ====================
let lang = "en";

// ====================
// QUESTIONS
// ====================
const questions = {

en:[

{
q:"What subject do you like most?",
a:["Art","Math","Computers","Biology"],
c:["Architect","Engineer","Programmer","Doctor"]
},

{
q:"What do you prefer?",
a:["Design","Logic","Coding","Helping"],
c:["Architect","Engineer","Programmer","Doctor"]
},

{
q:"Your strongest skill?",
a:["Creativity","Problem solving","Tech skills","Communication"],
c:["Architect","Engineer","Programmer","Doctor"]
}

],

sq:[

{
q:"Cila lëndë të pëlqen më shumë?",
a:["Art","Matematikë","Kompjuterë","Biologji"],
c:["Architect","Engineer","Programmer","Doctor"]
},

{
q:"Çfarë preferon?",
a:["Dizajn","Logjikë","Kodim","Ndihmë"],
c:["Architect","Engineer","Programmer","Doctor"]
},

{
q:"Aftësia jote më e fortë?",
a:["Kreativitet","Zgjidhje problemesh","Teknologji","Komunikim"],
c:["Architect","Engineer","Programmer","Doctor"]
}

]

};

// ====================
// QUIZ
// ====================
let i = 0;

let score = {

Architect:0,
Engineer:0,
Programmer:0,
Doctor:0

};

// ====================
// LOAD QUESTION
// ====================
function load(){

let q = questions[lang][i];

document.getElementById("question").innerText =
q.q;

let btns =
document.querySelectorAll(".answers button");

btns.forEach((b,index)=>{

b.innerText = q.a[index];

});

updateProgress();

}

// ====================
// ANSWER
// ====================
function answer(index){

let career =
questions[lang][i].c[index];

score[career]++;

i++;

if(i < questions[lang].length){

load();

}
else{

let best = "";
let max = 0;

for(let k in score){

if(score[k] > max){

max = score[k];
best = k;

}

}

localStorage.setItem("career", best);

window.location.href = "results.html";

}

}

// ====================
// PROGRESS
// ====================
function updateProgress(){

let percent =
Math.round((i / questions[lang].length)*100);

document.getElementById("progressFill").style.width =
percent + "%";

document.getElementById("progressText").innerText =
percent + "%";

}

// ====================
// CHANGE LANGUAGE
// ====================
function setLang(l){

lang = l;

document.getElementById("title").innerText =
lang === "en"
? "Career Quiz"
: "Quiz Karriere";

i = 0;

load();

}

// START
load();

</script>

</body>
</html>
