<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <link rel="stylesheet"
    href="style.css">
</head>

<body>

<section class="hero">

    <h1>Create Account</h1>

    <input type="text"
    placeholder="Full Name">

    <input type="email"
    placeholder="Email">

    <input type="password"
    placeholder="Password">

    <button onclick="register()">
        Register
    </button>

</section>

<script>

function register(){

    alert("Account Created!");

    window.location.href =
    "login.html";
}

</script>

</body>

</html>
